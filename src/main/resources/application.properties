spring.application.name=event-notificator


spring.datasource.url=jdbc:postgresql://localhost:5433/event-notificator
spring.datasource.username=user
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

server.port=8081

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

jwt.lifetime = 886400000
jwt.secret-key = MIIB1JCCAT8CAQAWGZUXEJAQBQNVBAOTCWFJY2VZCZM2MDEUMBIGA1UECXMLZW5N

logging.level.org.springframework.security.access.AccessDecisionManager=DEBUG
logging.level.org.springframework.security.web.access.ExceptionTranslationFilter=DEBUG

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.dev.eventnotificator.event.EventKafkaMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dev.eventnotificator.event,*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

scheduler.cleanup.cron=0 */10 * * * *